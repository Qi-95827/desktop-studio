[Rainmeter]
Update=33
DefaultUpdateDivider=-1

[Metadata]
Author=Creewick
Version=1.0
License=CC BY-NC-SA 4.0

[Variables]
WidgetName=Music
WidgetSize=Wide
@Include1=#@#Variables\Music.inc
@Include2=#@#Scripts\Includes\Widget.inc
@Include3=#@#Scripts\Widgets\Music.inc
@Include4=#@#Languages\#Language#\Widgets\Music.inc
LightThemeBackground=fffffff0
LightThemeForeground=26323c
LyricsEnabled=0
LyricsRows=3
LyricsFontSize=18
LyricsLineHeight=40
@IncludeLyrics=__STUDIO_ROOT__\Data\NetEase\LyricsView.inc

[BackgroundMeter]
LeftMouseDoubleClickAction=[#MusicApp#]
Shape=Rectangle 0,0,#WidgetWidth#,(#WidgetHeight#+#LyricsEnabled#*(#LyricsRows#*#LyricsLineHeight#+20)),#WidgetRadius#,#WidgetRadius# | Fill Color #BackgroundColor# | StrokeWidth 0

[CoverMask]
Meter=Shape
Shape=Rectangle 0,0,(#WidgetHeight#*0.8),(#WidgetHeight#*0.8),(#WidgetRadius#*0.5) | StrokeWidth 0
X=(#WidgetPadding#+#WidgetHeight#*0.1)
Y=(#WidgetPadding#+#WidgetHeight#*0.1)

[CoverMeter]
Meter=Image
Group=Text
ImageName=[CoverMeasure]
DynamicVariables=1
Container=CoverMask
W=(#WidgetHeight#*0.8)
H=(#WidgetHeight#*0.8)
PreserveAspectRatio=2

[TitleMeter]
Meter=String
Group=Text
Text=[TitleMeasure]
DynamicVariables=1
FontFace=#FontFace#
FontWeight=500
FontColor=#ForegroundColor#
FontSize=(#WidgetHeight#*0.07)
StringAlign=Center
X=(#WidgetPadding#+#WidgetWidth#*0.72)
Y=(#WidgetPadding#+#WidgetHeight#*0.3)
W=(#WidgetWidth#*0.5)
Hidden=([StateMeasure]=0)
ClipString=1
AntiAlias=1

[ArtistMeter]
Meter=String
Group=Text
MeterStyle=TitleMeter
Text=[ArtistMeasure]
DynamicVariables=1
FontWeight=400
FontColor=#ForegroundColor#a0
Y=(#WidgetPadding#+#WidgetHeight#*0.42)
Hidden=([StateMeasure]=0)

[CoverOverlay]
Meter=Shape
Group=Buttons
Shape=Rectangle 0,0,(#WidgetHeight#*0.8),(#WidgetHeight#*0.8),(#WidgetRadius#*0.5) | Fill Color #GrayColor# | StrokeWidth 0
X=(#WidgetPadding#+#WidgetHeight#*0.1)
Y=(#WidgetPadding#+#WidgetHeight#*0.1)
Hidden=([StateMeasure]<>0)
DynamicVariables=1

[PauseMeter]
Meter=Image
Group=Buttons
ImageName=#@#Images\Music\pause.png
ImageTint=#ForegroundColor#
X=(#WidgetPadding#+#WidgetWidth#*0.67)
Y=(#WidgetPadding#+#WidgetHeight#*0.62)
W=(#WidgetHeight#*0.2)
Hidden=([StateMeasure]<>1)
LeftMouseUpAction=[!CommandMeasure "NetEasePlayPause" "Run"]
DynamicVariables=1

[PlayMeter]
Meter=Image
Group=Buttons
MeterStyle=PauseMeter
ImageName=#@#Images\Music\play.png
Hidden=([StateMeasure]=1)
LeftMouseUpAction=[!CommandMeasure "NetEasePlayPause" "Run"]
DynamicVariables=1

[BackMeter]
Meter=Image
Group=Buttons
MeterStyle=PauseMeter
ImageName=#@#Images\Music\back.png
X=(#WidgetPadding#+#WidgetWidth#*0.52)
Hidden=0
LeftMouseUpAction=[!CommandMeasure "NetEasePrevious" "Run"]
DynamicVariables=1

[NextMeter]
Meter=Image
Group=Buttons
MeterStyle=PauseMeter
ImageName=#@#Images\Music\next.png
X=(#WidgetPadding#+#WidgetWidth#*0.82)
Hidden=0
LeftMouseUpAction=[!CommandMeasure "NetEaseNext" "Run"]
DynamicVariables=1

[NoMusicMeter]
Meter=String
MeterStyle=TitleMeter
Text=#tMusic#
Hidden=([StateMeasure]<>0)
DynamicVariables=1

[MusicLogo]
Meter=Image
Group=Buttons
ImageName=#@#Images\Music\Music.png
ImageTint=#ForegroundColor#
X=(#WidgetPadding#+#WidgetWidth#*0.89)
Y=(#WidgetPadding#+#WidgetHeight#*0.1)
W=(#WidgetHeight#*0.15)
DynamicVariables=1

[NetEasePlayPause]
Measure=Plugin
Plugin=RunCommand
Program=C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -File "__STUDIO_ROOT__\scripts\NetEase-Media.ps1" -Action PlayPause
State=Hide
OutputType=UTF8

[NetEasePrevious]
Measure=Plugin
Plugin=RunCommand
Program=C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -File "__STUDIO_ROOT__\scripts\NetEase-Media.ps1" -Action Previous
State=Hide
OutputType=UTF8

[NetEaseNext]
Measure=Plugin
Plugin=RunCommand
Program=C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -File "__STUDIO_ROOT__\scripts\NetEase-Media.ps1" -Action Next
State=Hide
OutputType=UTF8

[LyricsAnimation]
Measure=Script
ScriptFile=#@#Scripts\Widgets\LyricsAnimation.lua
UpdateDivider=1
Disabled=1

[LyricsDivider]
Meter=Shape
Group=Lyrics
Shape=Line 24,(#WidgetHeight#-2),(#WidgetWidth#-24),(#WidgetHeight#-2) | Stroke Color 38,50,60,22 | StrokeWidth 1
Hidden=(1-#LyricsEnabled#)
DynamicVariables=1

[LyricsViewport]
Meter=Shape
Group=Lyrics
X=24
Y=((#WidgetHeight#+8)*#LyricsEnabled#)
Shape=Rectangle 0,0,(#WidgetWidth#-48),(#LyricsRows#*#LyricsLineHeight#) | Fill Color 255,255,255,255 | StrokeWidth 0
Hidden=(1-#LyricsEnabled#)
DynamicVariables=1

[LyricsStyle]
Meter=String
Group=Lyrics
Container=LyricsViewport
FontFace=Microsoft YaHei UI
FontSize=#LyricsFontSize#
FontColor=78828CAA
StringAlign=Center
AntiAlias=1
ClipString=1
W=(#WidgetWidth#-56)
H=#LyricsLineHeight#
X=((#WidgetWidth#-48)/2)
Y=0
Text=
Hidden=(1-#LyricsEnabled#)
DynamicVariables=1

[Lyric0]
Meter=String
MeterStyle=LyricsStyle
Y=(#LyricsLineHeight#*0)

[Lyric1]
Meter=String
MeterStyle=LyricsStyle
Y=(#LyricsLineHeight#*1)

[Lyric2]
Meter=String
MeterStyle=LyricsStyle
Y=(#LyricsLineHeight#*2)

[Lyric3]
Meter=String
MeterStyle=LyricsStyle
Y=(#LyricsLineHeight#*3)

[Lyric4]
Meter=String
MeterStyle=LyricsStyle
Y=(#LyricsLineHeight#*4)

[Lyric5]
Meter=String
MeterStyle=LyricsStyle
Y=(#LyricsLineHeight#*5)
